<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobLens — Blocked Companies</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #1a1a1a;
      width: 320px;
      min-height: 100px;
      max-height: 480px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      letter-spacing: 0.01em;
    }
    .header p {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Add form */
    .add-form {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .add-form input {
      flex: 1;
      padding: 5px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      color: #111827;
    }
    .add-form input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99,102,241,0.15);
    }
    .add-form button {
      padding: 5px 12px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-form button:hover { background: #374151; }

    /* List */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }

    .company-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px;
      gap: 8px;
      transition: background 0.1s;
    }
    .company-row:hover { background: #f9fafb; }

    .company-name {
      flex: 1;
      font-size: 12px;
      color: #111827;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-btn {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-size: 11px;
      color: #9ca3af;
      cursor: pointer;
      line-height: 1;
    }
    .remove-btn:hover {
      background: #fdecea;
      border-color: #f7c2bd;
      color: #b42318;
    }

    /* Footer */
    .footer {
      padding: 8px 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>JobLens — Blocked Companies</h1>
    <p>Jobs from these companies are hidden on LinkedIn.</p>
  </div>

  <div class="add-form">
    <input type="text" id="add-input" placeholder="Company name…" autocomplete="off" />
    <button id="add-btn">Add</button>
  </div>

  <div class="list-container" id="list-container">
    <div class="empty-state" id="empty-state">No companies blocked yet.</div>
  </div>

  <div class="footer" id="footer"></div>

  <script src="popup.js"></script>
</body>
</html>
